# YAML rules matched against HTTP responses by the built-in rules engine.
# Each rule: id, severity, where (headers|body), and what to match.
rules:
  - id: missing-hsts
    title: Missing Strict-Transport-Security header
    severity: low
    cwe: CWE-319
    owasp: A05:2021
    match:
      type: header_absent
      header: strict-transport-security
    remediation: "Add `Strict-Transport-Security: max-age=31536000; includeSubDomains`."

  - id: missing-csp
    title: Missing Content-Security-Policy header
    severity: low
    cwe: CWE-1021
    owasp: A05:2021
    match:
      type: header_absent
      header: content-security-policy
    remediation: "Start with a Report-Only policy, then enforce."

  - id: server-version-disclosure
    title: Server header discloses a version
    severity: low
    cwe: CWE-200
    owasp: A05:2021
    match:
      type: header_regex
      header: server
      pattern: "/[0-9]+\\.[0-9]+"
    remediation: "Hide version banners (e.g. ServerTokens Prod)."
