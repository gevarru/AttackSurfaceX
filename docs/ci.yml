# GitHub Actions CI
# ─────────────────────────────────────────────────────────────
# GitHub blocks API pushes to .github/workflows/ without the
# `workflow` OAuth scope, so this file ships here instead.
# To activate CI: move this file to .github/workflows/ci.yml
# (e.g. from the GitHub web UI: Add file > upload, or locally:
#  mkdir -p .github/workflows && mv docs/ci.yml .github/workflows/)
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check asx tests
      - run: mypy asx

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t attacksurfacex .
      - run: docker run --rm attacksurfacex --help
