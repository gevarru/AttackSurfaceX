[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attacksurfacex"
version = "0.1.0"
description = "Safe, non-destructive attack surface scanner for websites and servers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Gevar Sleman"}]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pytest-asyncio>=0.23"]

[project.scripts]
asx = "asx.cli:app"

[tool.setuptools.packages.find]
include = ["asx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
